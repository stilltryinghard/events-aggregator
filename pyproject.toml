[project]
name = "events-aggregator"
version = "0.1.0"
description = "Агрегатор событий поверх Events Provider API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
    "pydantic[email]>=2.14.1",
    "sqlalchemy[asyncio]>=2.1.4",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
